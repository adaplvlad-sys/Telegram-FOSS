name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Create API_KEYS file
      run: |
        echo "APP_ID=${{ secrets.API_ID }}" > API_KEYS
        echo "APP_HASH=${{ secrets.API_HASH }}" >> API_KEYS

    - name: 100% Fix CMake -j flag
      run: |
        # 1. Находим путь к cmake
        CMAKE_PATH=$(which cmake)
        echo "Original CMake: $CMAKE_PATH"
        
        # 2. Переименовываем оригинальный cmake
        sudo mv $CMAKE_PATH ${CMAKE_PATH}_original
        
        # 3. Создаем скрипт-обертку, который вырезает -j=16 и -j16 из аргументов
        sudo tee $CMAKE_PATH > /dev/null << 'EOF'
        #!/bin/bash
        # Убираем проблемные флаги из аргументов
        ARGS=()
        for arg in "$@"; do
            if [[ "$arg" == "-j=16" ]] || [[ "$arg" == "-j16" ]]; then
                continue
            fi
            ARGS+=("$arg")
        done
        # Вызываем оригинальный CMake с очищенными аргументами
        exec ${0}_original "${ARGS[@]}"
        EOF
        
        sudo chmod +x $CMAKE_PATH
        echo "Wrapper created successfully"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleAfatDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
