name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Create API_KEYS file
      run: |
        echo "APP_ID=${{ secrets.API_ID }}" > API_KEYS
        echo "APP_HASH=${{ secrets.API_HASH }}" >> API_KEYS

    - name: Fix SDK paths
      run: |
        # Создаем local.properties с жестким путем к SDK
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        
        # Насильно удаляем ВСЕ файлы с версией 34x в системе (если они есть)
        sudo find /usr/local/lib/android -name "source.properties" -exec sudo sed -i 's/34x/33/g' {} + || true
        sudo find /usr/local/lib/android -name "source.properties" -exec sudo sed -i 's/ApiLevel=34/ApiLevel=33/g' {} + || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        ./gradlew assembleAfatDebug --stacktrace --no-daemon -Pandroid.injected.build.api=33

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
