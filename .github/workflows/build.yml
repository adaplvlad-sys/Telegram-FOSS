name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Create API_KEYS file
      run: |
        echo "APP_ID=${{ secrets.API_ID }}" > API_KEYS
        echo "APP_HASH=${{ secrets.API_HASH }}" >> API_KEYS

    - name: Patch CMake (фикс ошибки -j=16)
      run: |
        # Убираем жестко заданный флаг -j=16 из Gradle
        find . -name "*.gradle" -exec sed -i 's/-j=16//g' {} + || true
        find . -name "CMakeLists.txt" -exec sed -i 's/-j=16//g' {} + || true
        # Добавляем флаг, чтобы CMake не пытался использовать параллельную сборку
        echo "org.gradle.parallel=false" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleAfatDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
