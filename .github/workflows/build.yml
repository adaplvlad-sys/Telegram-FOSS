name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Create API_KEYS file
      run: |
        echo "APP_ID=${{ secrets.API_ID }}" > API_KEYS
        echo "APP_HASH=${{ secrets.API_HASH }}" >> API_KEYS

    - name: Fix Gradle files (заменяем 34x на 33)
      run: |
        # Ищем и заменяем 34x на 33 во всех build.gradle
        find . -name "build.gradle" -exec sed -i 's/34x/33/g' {} +
        find . -name "build.gradle" -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 33/g' {} +
        find . -name "build.gradle" -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 33/g' {} +

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleAfatDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
