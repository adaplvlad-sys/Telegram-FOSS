name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Create API_KEYS file
      run: |
        echo "APP_ID=${{ secrets.API_ID }}" > API_KEYS
        echo "APP_HASH=${{ secrets.API_HASH }}" >> API_KEYS

    - name: Hack Android SDK (фикс ошибки 34x)
      run: |
        # 1. Заставляем Gradle использовать конкретный путь к SDK
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        
        # 2. Перезаписываем системный файл source.properties, убирая "34x"
        echo "Pkg.Desc=Android SDK Platform 33" > /usr/local/lib/android/sdk/platforms/android-33/source.properties
        echo "AndroidVersion.ApiLevel=33" >> /usr/local/lib/android/sdk/platforms/android-33/source.properties
        echo "Pkg.Revision=3" >> /usr/local/lib/android/sdk/platforms/android-33/source.properties
        
        # 3. Удаляем папку с 34-м SDK, чтобы Gradle даже не смотрел в её сторону
        rm -rf /usr/local/lib/android/sdk/platforms/android-34 || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleAfatDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
